name: Build

on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: i686-pc-windows-msvc
            os: windows-latest
            artifact_name: gmsv_tungstenite_win32.dll
            binary_path: target/i686-pc-windows-msvc/release/gm_tungstenite.dll

          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact_name: gmsv_tungstenite_win64.dll
            binary_path: target/x86_64-pc-windows-msvc/release/gm_tungstenite.dll

          - target: i686-unknown-linux-gnu
            os: ubuntu-22.04
            artifact_name: gmsv_tungstenite_linux.dll
            binary_path: target/i686-unknown-linux-gnu/release/libgm_tungstenite.so

          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            artifact_name: gmsv_tungstenite_linux64.dll
            binary_path: target/x86_64-unknown-linux-gnu/release/libgm_tungstenite.so

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libclang-dev clang pkg-config libssl-dev

      - name: Install 32-bit Linux cross-compilation dependencies
        if: matrix.target == 'i686-unknown-linux-gnu'
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y gcc-multilib g++-multilib libssl-dev:i386 pkg-config

      - name: Configure cross pkg-config for 32-bit Linux
        if: matrix.target == 'i686-unknown-linux-gnu'
        run: |
          echo "PKG_CONFIG_ALLOW_CROSS=1" >> $GITHUB_ENV
          echo "PKG_CONFIG_PATH=/usr/lib/i386-linux-gnu/pkgconfig" >> $GITHUB_ENV

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          # Include the runner image so caches from newer glibc (e.g. ubuntu-24.04)
          # are not restored onto ubuntu-22.04. prefix-key bump drops the poisoned cache.
          prefix-key: v1-rust
          key: ${{ matrix.target }}-${{ matrix.os }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Prepare binary artifact (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          cp "${{ matrix.binary_path }}" "dist/${{ matrix.artifact_name }}"

      - name: Prepare binary artifact (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          cp "${{ matrix.binary_path }}" "dist/${{ matrix.artifact_name }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.artifact_name }}
          if-no-files-found: error
